<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Farbvarianten</title>
<link rel="stylesheet" href="https://use.typekit.net/vun7ytb.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#faf8f5; color:#1e1d1d;
         font:400 13px Montserrat,-apple-system,sans-serif; padding:22px; }
  h1 { font:400 30px/1 "american-scribe",cursive; margin:0 0 2px; }
  p.sub { color:#8b857f; font-size:12px; margin:0 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
  figure { margin:0; }
  canvas, img.ref { width:100%; aspect-ratio:1; display:block;
                    border:1px solid #e9e3dc; background:#fff; }
  figcaption { margin-top:7px; font-size:11px; color:#8b857f; text-align:center;
               letter-spacing:.06em; }
  figure.orig figcaption { color:#b07f82; font-weight:500; }
</style></head>
<body>
<h1>Leartist</h1>
<p class="sub">Ein Ebenensatz, neun Fellfarben — alles live im Browser gerechnet.</p>
<div class="grid" id="grid"></div>
<script type="module">
import { buildStructureMap, applyColor, rgbToHsl, hslToRgb, hexToRgb } from './recolor.js';
const S = 500;

// Farben und Ableitung identisch zum Konfigurator halten
const VARIANTS = [
  { name:'Rappe',       fell:'#34303a', maehne:'#15131a', licht:'#b9c6e0', auge:'#4a3b2e', bg:['#efe9e6','#cfc4bf'] },
  { name:'Brauner',     fell:'#5c3a20', maehne:'#1a1512', licht:'#e8c9a0', auge:'#4a3728', bg:['#f0e6dc','#cdbaa8'] },
  { name:'Fuchs',       fell:'#a05a2c', maehne:'#8a4a24', licht:'#ffd9a0', auge:'#5c432c', bg:['#f5e8db','#d8bfa4'] },
  { name:'Dunkelfuchs', fell:'#5e3722', maehne:'#4a2a19', licht:'#d9a878', auge:'#4a3728', bg:['#efe3d9','#cbb3a2'] },
  { name:'Falbe',       fell:'#c19a62', maehne:'#3a2c1e', licht:'#ffe9bd', auge:'#4a3b2e', bg:['#f6eddc','#dbc9a9'] },
  { name:'Palomino',    fell:'#d2a263', maehne:'#f0e4cd', licht:'#fff3d6', auge:'#5c432c', bg:['#f8f0e0','#e0cdb0'] },
  { name:'Schimmel',    fell:'#d8d2ce', maehne:'#eae4df', licht:'#ffffff', auge:'#4a3b2e', bg:['#f3e7e6','#d9c6c2'] },
  { name:'Blue Roan',   fell:'#6e7684', maehne:'#22242b', licht:'#cfe0f5', auge:'#4a3b2e', bg:['#e8eaee','#c2c7d0'] },
  { name:'Rotschimmel', fell:'#b4897e', maehne:'#7d4f45', licht:'#ffe0d4', auge:'#5c432c', bg:['#f4e6e2','#d9bfb8'] },
];
const KONTUR = 0.42;

const toHex = ([r,g,b]) => '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
const outlineColor = (fell) => {
  const [h,s,l] = rgbToHsl(...hexToRgb(fell));
  return toHex(hslToRgb(h, Math.min(1,s*0.85), Math.min(0.92, Math.max(0.03, l*KONTUR))));
};

const catalogue = (await (await fetch('motive/index.json')).json()).motive;
const motif = catalogue[0];
const BASE = `motive/${motif.slug}`;

const load = (src) => new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=BASE+'/'+src;});

const prepped = [];
for (const def of motif.layers) {
  const img = await load(def.file);
  const c = document.createElement('canvas'); c.width=c.height=S;
  const cx = c.getContext('2d',{willReadFrequently:true});
  cx.drawImage(img,0,0,S,S);
  const e = { def, canvas:c };
  if (def.role==='tint') {
    e.map = buildStructureMap(cx.getImageData(0,0,S,S));
    e.tmp = document.createElement('canvas'); e.tmp.width=e.tmp.height=S;
    e.tmpCtx = e.tmp.getContext('2d'); e.buf = new ImageData(S,S);
  }
  prepped.push(e);
}

const grid = document.getElementById('grid');
for (const v of VARIANTS) {
  const fig = document.createElement('figure');
  const cv = document.createElement('canvas'); cv.width=cv.height=S;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(S*.5,S*.42,S*.05,S*.5,S*.5,S*.78);
  g.addColorStop(0,v.bg[0]); g.addColorStop(1,v.bg[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,S,S);

  for (const e of prepped) {
    ctx.globalCompositeOperation = e.def.blend;
    ctx.globalAlpha = 1;
    if (e.def.role==='tint') {
      const slot = e.def.slot;
      const isOutline = slot === 'outline';
      const color = isOutline ? outlineColor(v.fell) : v[slot];
      if (!color) continue;
      applyColor(e.map, color, isOutline ? 0.35 : 0.85, e.buf);
      e.tmpCtx.putImageData(e.buf,0,0);
      if (slot === 'licht') ctx.globalAlpha = 0.7;
      ctx.drawImage(e.tmp,0,0);
    } else ctx.drawImage(e.canvas,0,0);
  }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  const cap = document.createElement('figcaption'); cap.textContent = v.name;
  fig.append(cv, cap); grid.appendChild(fig);
}

if (motif.preview) {
  const fig = document.createElement('figure'); fig.className='orig';
  const im = document.createElement('img'); im.className='ref'; im.src=`${BASE}/${motif.preview}`;
  const cap = document.createElement('figcaption'); cap.textContent='Dein Original';
  fig.append(im, cap); grid.appendChild(fig);
}
document.title = 'ready';
</script>
</body></html>

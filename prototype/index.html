<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leartist — Logo-Konfigurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/vun7ytb.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #faf8f5;   /* warmes Off-White der Webseite */
    --surface: #ffffff;
    --ink:     #1e1d1d;
    --muted:   #8b857f;
    --soft:    #495057;
    --rose:    #d39c9f;   /* Altrosa-Akzent der Webseite */
    --rose-lt: #f0dedf;
    --line:    #e9e3dc;
    --sans: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "miller-banner-compressed", Georgia, serif;
    --script: "american-scribe", cursive;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); font: 400 14px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 20px 40px; display: flex; align-items: baseline; gap: 18px;
  }
  .brand { font: 400 30px/1 var(--script); color: var(--ink); }
  header .tag {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); font-weight: 500;
  }

  .wrap {
    display: grid; grid-template-columns: minmax(0,1fr) 380px;
    gap: 40px; padding: 40px; max-width: 1400px; margin: 0 auto; align-items: start;
  }
  @media (max-width: 960px) { .wrap { grid-template-columns: 1fr; gap: 28px; padding: 24px 16px; } }

  /* ---------- Bühne ---------- */
  .stage { position: sticky; top: 40px; }
  .canvas-box {
    position: relative; width: 100%; aspect-ratio: 1;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 2px; overflow: hidden;
    box-shadow: 0 18px 50px -28px rgba(30,29,29,.35);
  }
  canvas { width: 100%; height: 100%; display: block; }
  #reference { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .stage.compare #reference { display: block; }
  .stage-foot { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

  /* ---------- Bedienelemente ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 2px; padding: 22px 24px; margin-bottom: 18px;
  }
  .panel h2 {
    margin: 0 0 16px; font: 500 12px/1 var(--sans);
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .panel h2 .hint { float: right; text-transform: none; letter-spacing: 0; font-size: 11px; }

  .field + .field { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .field-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
  .field-head .name { font: 500 13px/1 var(--sans); letter-spacing: .02em; }
  .field-head .read { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; gap: 12px; }

  input[type=color] {
    width: 44px; height: 44px; flex: none; padding: 0; cursor: pointer;
    border: 1px solid var(--line); border-radius: 50%; background: none; overflow: hidden;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 50%; }

  .swatch-auto {
    width: 44px; height: 44px; flex: none; border-radius: 50%;
    border: 1px dashed var(--line); background: var(--line);
  }

  input[type=range] {
    flex: 1; min-width: 0; -webkit-appearance: none; appearance: none;
    height: 2px; background: var(--line); border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--surface); border: 1.5px solid var(--rose); cursor: pointer;
    box-shadow: 0 1px 4px rgba(30,29,29,.18);
  }

  /* ---------- Kacheln ---------- */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 2px; padding: 9px 6px; cursor: pointer;
    font: 400 11px/1.3 var(--sans); text-align: center; transition: border-color .15s;
  }
  .tile:hover { border-color: var(--rose); }
  .tile.on { border-color: var(--rose); background: var(--rose-lt); font-weight: 500; }
  .tile .swatch { height: 26px; border-radius: 2px; margin-bottom: 7px; }
  .tile img { width: 100%; aspect-ratio: 1; object-fit: cover; margin-bottom: 7px; background: var(--bg); }

  .segmented { display: flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
  .segmented button {
    flex: 1; border: 0; background: var(--surface); color: var(--soft);
    padding: 10px 8px; cursor: pointer; font: 400 12px var(--sans);
    border-right: 1px solid var(--line);
  }
  .segmented button:last-child { border-right: 0; }
  .segmented button.on { background: var(--rose-lt); color: var(--ink); font-weight: 500; }

  button.act {
    border: 1px solid var(--ink); background: none; color: var(--ink);
    border-radius: 2px; padding: 11px 20px; cursor: pointer;
    font: 500 11px var(--sans); letter-spacing: .12em; text-transform: uppercase;
    transition: background .15s, color .15s;
  }
  button.act:hover { background: var(--ink); color: var(--surface); }
  button.act.ghost { border-color: var(--line); color: var(--soft); }
  button.act.ghost:hover { background: var(--bg); color: var(--ink); border-color: var(--muted); }
  button.act.on { background: var(--ink); color: var(--surface); }

  /* ---------- Ebenenliste ---------- */
  details.layers summary {
    cursor: pointer; font: 500 12px var(--sans); letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted); list-style: none;
  }
  details.layers summary::-webkit-details-marker { display: none; }
  details.layers summary::after { content: " +"; }
  details.layers[open] summary::after { content: " –"; }
  .layer { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 12px; }
  .layer:first-of-type { margin-top: 14px; }
  .layer input { accent-color: var(--rose); }
  .layer .nm { flex: 1; }
  .layer .mode { color: var(--muted); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }

  #status { color: var(--muted); font-size: 11px; padding: 0 40px 40px; letter-spacing: .04em; }
  #status.err { color: #b4524f; }
  .note {
    font-size: 11px; line-height: 1.6; color: var(--muted);
    border-left: 2px solid var(--rose); padding-left: 12px; margin-top: 14px;
  }
</style>
</head>
<body>
<header>
  <span class="brand">Leartist</span>
  <span class="tag">Logo-Konfigurator</span>
</header>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="canvas-box">
      <canvas id="out" width="1000" height="1000"></canvas>
      <img id="reference" alt="Original">
    </div>
    <div class="stage-foot">
      <button class="act" id="btnDownload">Als PNG sichern</button>
      <button class="act ghost" id="btnCompare">Original</button>
      <button class="act ghost" id="btnRandom">Zufall</button>
      <button class="act ghost" id="btnReset">Zurücksetzen</button>
    </div>
  </div>

  <div>
    <div class="panel" id="motifPanel" hidden>
      <h2>Motiv</h2>
      <div class="tiles" id="motifs"></div>
    </div>

    <div class="panel" id="variantPanel" hidden>
      <h2>Fellmuster</h2>
      <div class="segmented" id="variants"></div>
    </div>

    <div class="panel">
      <h2>Vorlagen</h2>
      <div class="tiles" id="presets"></div>
    </div>

    <div class="panel">
      <h2>Farben</h2>
      <div id="colorFields"></div>
    </div>

    <div class="panel">
      <h2>Hintergrund</h2>
      <div class="segmented" id="bgType" style="margin-bottom:16px"></div>
      <div class="row">
        <input type="color" id="bg1" value="#f3e7e6">
        <input type="color" id="bg2" value="#d9c6c2">
      </div>
    </div>

    <div class="panel">
      <details class="layers">
        <summary>Ebenen</summary>
        <div id="layers"></div>
      </details>
    </div>
  </div>
</div>
<div id="status">Lade Motive …</div>

<script type="module" src="app.js"></script>
</body>
</html>
